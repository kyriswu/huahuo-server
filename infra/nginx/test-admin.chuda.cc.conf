# Included inside nginx's http block by /etc/nginx/sites-enabled/.
# Exclude query strings and credentials from the access log.
log_format huahuo_test_admin '$remote_addr - [$time_local] '
                           '"$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name test-admin.chuda.cc;
    server_tokens off;
    access_log /var/log/nginx/test-admin.chuda.cc.access.log huahuo_test_admin;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://test-admin.chuda.cc$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test-admin.chuda.cc;
    server_tokens off;
    access_log /var/log/nginx/test-admin.chuda.cc.access.log huahuo_test_admin;

    ssl_certificate /etc/letsencrypt/live/test-admin.chuda.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-admin.chuda.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:huahuo_test_admin_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;

    location = / {
        return 302 /admin;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # The development service also receives HTTPS-only session cookies.
        proxy_cookie_flags hh_admin_session secure httponly samesite=strict;
        proxy_cache off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
