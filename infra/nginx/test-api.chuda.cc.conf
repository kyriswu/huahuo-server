# Included inside nginx's http block by /etc/nginx/sites-enabled/.
map $http_upgrade $huahuo_test_api_connection_upgrade {
    default upgrade;
    ''      '';
}

# Exclude query strings: media playback URLs contain signed capabilities.
log_format huahuo_test_api '$remote_addr - [$time_local] '
                         '"$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name test-api.chuda.cc;
    server_tokens off;
    access_log /var/log/nginx/test-api.chuda.cc.access.log huahuo_test_api;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://test-api.chuda.cc$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test-api.chuda.cc;
    server_tokens off;
    access_log /var/log/nginx/test-api.chuda.cc.access.log huahuo_test_api;

    ssl_certificate /etc/letsencrypt/live/test-api.chuda.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-api.chuda.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:huahuo_test_api_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Match the API's default 100 MiB upload limit; route limits still apply.
    client_max_body_size 100m;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $huahuo_test_api_connection_upgrade;

        # Forward streaming events and upload bodies without disk buffering.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
