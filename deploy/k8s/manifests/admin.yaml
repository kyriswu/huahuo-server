apiVersion: apps/v1
kind: Deployment
metadata:
  name: huahuo-admin
  namespace: ns-applications
  labels:
    app.kubernetes.io/name: huahuo-server
    app.kubernetes.io/component: admin
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 5
  progressDeadlineSeconds: 4200
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: huahuo-server
      app.kubernetes.io/component: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: huahuo-server
        app.kubernetes.io/component: admin
    spec:
      serviceAccountName: sa-huahuo-server
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Preserve the database-configured 10–60 minute app budget.
      terminationGracePeriodSeconds: 3630
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin
          image: huahuo-server:replace-me
          imagePullPolicy: IfNotPresent
          command: ["node", "--enable-source-maps", "dist/entrypoints/admin.js"]
          envFrom:
            - configMapRef:
                name: huahuo-config
            - secretRef:
                name: huahuo-redis
            - secretRef:
                name: huahuo-admin-env
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: huahuo-db-runtime
                  key: DATABASE_URL
            - name: APP_ENV
              value: test
            - name: NODE_ENV
              value: production
            - name: SERVICE_ROLE
              value: admin
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: METRICS_ENABLED
              value: "true"
            - name: METRICS_HOST
              value: "0.0.0.0"
            - name: METRICS_PORT
              value: "9464"
            - name: HTTP_TRUST_PROXY_HOPS
              value: "0"
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9464
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 8
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-ca
              mountPath: /app/certs
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: db-ca
          configMap:
            name: huahuo-db-ca
            optional: true
