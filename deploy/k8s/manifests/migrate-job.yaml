apiVersion: batch/v1
kind: Job
metadata:
  generateName: huahuo-migrate-
  namespace: ns-applications
  labels:
    app.kubernetes.io/name: huahuo-server
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: huahuo-server
        app.kubernetes.io/component: migrate
    spec:
      serviceAccountName: sa-huahuo-server
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: huahuo-server:replace-me
          imagePullPolicy: IfNotPresent
          command: __HUAHUO_ACK_MIGRATE_COMMAND__
          envFrom:
            - secretRef:
                name: huahuo-migrate-env
          env:
            - name: APP_ENV
              value: test
            - name: NODE_ENV
              value: production
            - name: SERVICE_ROLE
              value: migrate
            - name: DATABASE_POOL_MAX
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-ca
              mountPath: /app/certs
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: db-ca
          configMap:
            name: huahuo-db-ca
            optional: true
