name: ${COMPOSE_PROJECT_NAME:-huahuo-server-dev}

x-backend: &backend
  image: ${BACKEND_IMAGE:-huahuo-server:dev}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NODE_IMAGE: ${NODE_IMAGE:-node:26.12.1-bookworm-slim}
      PNPM_VERSION: ${PNPM_VERSION:-10.15.1}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,noexec,size=128m
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  networks: [backend]
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

x-app-env: &app-env
  PROCESSING_NODES_CLOUD_CONTROL_ENABLED: ${PROCESSING_NODES_CLOUD_CONTROL_ENABLED:-}
  HTTP_UPLOAD_HARD_MAX_BYTES: ${HTTP_UPLOAD_HARD_MAX_BYTES:-2147483648}
  PROCESSING_NODE_LEASE_MS: ${PROCESSING_NODE_LEASE_MS:-30000}
  PROCESSING_NODE_DEDUP_TTL_SECONDS: ${PROCESSING_NODE_DEDUP_TTL_SECONDS:-86400}
  PROCESSING_NODE_MAX_PENDING: ${PROCESSING_NODE_MAX_PENDING:-128}
  NODE_ENV: production
  APP_ENV: ${APP_ENV:-development}
  # Shared callers use a configured API address; never infer it from a container name.
  API_SERVICE_BASE_URL: ${API_SERVICE_BASE_URL:-${APP_PUBLIC_BASE_URL:-}}
  METRICS_ENABLED: ${METRICS_ENABLED:-true}
  METRICS_HOST: 0.0.0.0
  METRICS_PORT: '9464'
  METRICS_SERVICE: ${METRICS_SERVICE:-huahuo-server}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
  PROVIDER_MODE: ${PROVIDER_MODE:-disabled}
  ALLOW_MOCK_PROVIDERS: ${ALLOW_MOCK_PROVIDERS:-false}
  DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
  DATABASE_SSL_CA_FILE: ${DATABASE_SSL_CA_FILE:-}
  DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-5000}
  DB_SCHEMA_MIN_VERSION: ${DB_SCHEMA_MIN_VERSION:-1}
  APP_JWT_ISSUER: ${APP_JWT_ISSUER:-huahuo-server}
  APP_JWT_AUDIENCE: ${APP_JWT_AUDIENCE:-huahuo-server,huahuo-agent}
  APP_JWT_SERVER_AUDIENCE: ${APP_JWT_SERVER_AUDIENCE:-huahuo-server}
  APP_JWT_KEY_ID: ${APP_JWT_KEY_ID:-server-current}
  APP_ACCESS_TOKEN_TTL_SECONDS: ${APP_ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
  APP_JWT_PRIVATE_KEY: ${APP_JWT_PRIVATE_KEY:-}
  APP_JWT_PUBLIC_KEY: ${APP_JWT_PUBLIC_KEY:-}
  APP_JWT_PREVIOUS_PUBLIC_KEY: ${APP_JWT_PREVIOUS_PUBLIC_KEY:-}
  APP_JWT_PREVIOUS_KEY_ID: ${APP_JWT_PREVIOUS_KEY_ID:-}
  BILLING_MODE: ${BILLING_MODE:-development}
  # Global vector database identity; connection secrets are injected only where used.
  MILVUS_DATABASE: ${MILVUS_DATABASE:-default}
  MILVUS_TLS: ${MILVUS_TLS:-true}
  MILVUS_CREATE_IF_MISSING: ${MILVUS_CREATE_IF_MISSING:-false}
  KB_NOTE_HYBRID_COLLECTION: ${KB_NOTE_HYBRID_COLLECTION:-huahuo_kb_note_hybrid_chunks}
  KB_DOCUMENT_KEYWORD_COLLECTION: ${KB_DOCUMENT_KEYWORD_COLLECTION:-huahuo_kb_keyword_chunks}
  RAG_PROVIDER_MODE: ${RAG_PROVIDER_MODE:-disabled}
  RAG_SOURCE_ALLOWED_HOSTS: ${RAG_SOURCE_ALLOWED_HOSTS:-}
  RAG_EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-}
  RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-qwen3.7-text-embedding-flash}
  RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1024}
  RAG_EMBEDDING_PROFILE: ${RAG_EMBEDDING_PROFILE:-qwen3.7-text-embedding-flash-1024-fp16}
  RAG_RERANK_PROVIDER: ${RAG_RERANK_PROVIDER:-disabled}
  RAG_RERANK_BASE_URL: ${RAG_RERANK_BASE_URL:-}
  RAG_RERANK_API_KEY: ${RAG_RERANK_API_KEY:-}
  RAG_RERANK_MODEL: ${RAG_RERANK_MODEL:-qwen3.7-text-rerank}
  HTTP_REQUEST_TIMEOUT_MS: ${HTTP_REQUEST_TIMEOUT_MS:-60000}
  HTTP_CONNECTION_TIMEOUT_MS: ${HTTP_CONNECTION_TIMEOUT_MS:-65000}
  HUAHUO_STUDIO_AUTH_ENABLED: ${HUAHUO_STUDIO_AUTH_ENABLED:-false}
  HUAHUO_STUDIO_ORIGIN: ${HUAHUO_STUDIO_ORIGIN:-}
  HUAHUO_AGENT_PUBLIC_PATH: ${HUAHUO_AGENT_PUBLIC_PATH:-/agent}
  REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis:6379/0}
  REDIS_QUEUE_URL: ${REDIS_QUEUE_URL:-redis://redis:6379/1}
  TASK_LEASE_MS: ${TASK_LEASE_MS:-15000}
  TASK_REDELIVERY_MS: ${TASK_REDELIVERY_MS:-30000}
  SCHEDULER_INTERVAL_MS: ${SCHEDULER_INTERVAL_MS:-1000}
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-huahuo-dev}

x-processing-nodes-env: &processing-nodes-env
  # Node credentials and token references are resolved at runtime, never stored in the DB.
  PROCESSING_NODE_TOKEN_DOCUMENT: ${PROCESSING_NODE_TOKEN_DOCUMENT:-}
  PROCESSING_NODE_TOKEN_AUDIO: ${PROCESSING_NODE_TOKEN_AUDIO:-}
  STORAGE_ALIYUN_OSS_BUCKET: ${STORAGE_ALIYUN_OSS_BUCKET:-}
  STORAGE_ALIYUN_OSS_KEY_PREFIX: ${STORAGE_ALIYUN_OSS_KEY_PREFIX:-huahuo}
  ALIYUN_RAM_ACCESS_KEY_ID: ${ALIYUN_RAM_ACCESS_KEY_ID:-}
  ALIYUN_RAM_ACCESS_KEY_SECRET: ${ALIYUN_RAM_ACCESS_KEY_SECRET:-}
  ALIYUN_RAM_SECURITY_TOKEN: ${ALIYUN_RAM_SECURITY_TOKEN:-}

x-runtime-deps: &runtime-deps
  migrate:
    condition: service_completed_successfully
  redis:
    condition: service_healthy

x-health: &health
  test: ['CMD', 'node', 'scripts/healthcheck.mjs']
  interval: 5s
  timeout: 8s
  retries: 4
  start_period: 10s

services:
  api-server:
    <<: *backend
    command: ['node', '--enable-source-maps', 'dist/entrypoints/api-server.js']
    environment:
      <<: *app-env
      SERVICE_ROLE: api-server
      HOST: 0.0.0.0
      PORT: '3000'
      HTTP_TRUST_PROXY_HOPS: ${API_TRUST_PROXY_HOPS:-1}
      HEALTHCHECK_URL: http://127.0.0.1:3000/health/ready
      DATABASE_URL: ${DATABASE_API_URL:-${DATABASE_URL:?Set runtime database URL}}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX_API:-10}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:3000}
      APP_TOKEN_SECRET: ${APP_TOKEN_SECRET:?Generate a development secret}
      ENABLE_DEMO_TASKS: ${ENABLE_DEMO_TASKS:-false}
      SMS_ALIYUN_REGION_ID: ${SMS_ALIYUN_REGION_ID:-cn-hangzhou}
      SMS_ALIYUN_SIGN_NAME: ${SMS_ALIYUN_SIGN_NAME:-}
      SMS_ALIYUN_TEMPLATE_CODE: ${SMS_ALIYUN_TEMPLATE_CODE:-}
      SMS_ALIYUN_CODE_PARAM: ${SMS_ALIYUN_CODE_PARAM:-code}
      SMS_ALIYUN_CONNECT_TIMEOUT_MS: ${SMS_ALIYUN_CONNECT_TIMEOUT_MS:-3000}
      SMS_ALIYUN_READ_TIMEOUT_MS: ${SMS_ALIYUN_READ_TIMEOUT_MS:-3000}
      RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-}
      grpc_proxy: ${grpc_proxy:-}
      MILVUS_ADDRESS: ${MILVUS_ADDRESS:-}
      MILVUS_USERNAME: ${MILVUS_USERNAME:-}
      MILVUS_PASSWORD: ${MILVUS_PASSWORD:-}
      USER_AGREEMENT_VERSION: ${USER_AGREEMENT_VERSION:-}
      PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_ROOT: /app/var/storage
      STORAGE_ALIYUN_OSS_REGION: ${STORAGE_ALIYUN_OSS_REGION:-cn-beijing}
      STORAGE_ALIYUN_OSS_ENDPOINT: ${STORAGE_ALIYUN_OSS_ENDPOINT:-https://oss-cn-beijing.aliyuncs.com}
      STORAGE_ALIYUN_OSS_PUBLIC_ENDPOINT: ${STORAGE_ALIYUN_OSS_PUBLIC_ENDPOINT:-}
      STORAGE_ALIYUN_OSS_BUCKET: ${STORAGE_ALIYUN_OSS_BUCKET:-}
      ALIYUN_RAM_ACCESS_KEY_ID: ${ALIYUN_RAM_ACCESS_KEY_ID:-}
      ALIYUN_RAM_ACCESS_KEY_SECRET: ${ALIYUN_RAM_ACCESS_KEY_SECRET:-}
      STORAGE_ALIYUN_OSS_SECURE: ${STORAGE_ALIYUN_OSS_SECURE:-true}
      STORAGE_ALIYUN_OSS_TIMEOUT_MS: ${STORAGE_ALIYUN_OSS_TIMEOUT_MS:-120000}
      STORAGE_ALIYUN_OSS_KEY_PREFIX: ${STORAGE_ALIYUN_OSS_KEY_PREFIX:-huahuo}
    ports:
      # Trusted ingress/internal callers only; clients authenticate at the ingress.
      - '${API_BIND_HOST:-127.0.0.1}:${API_HOST_PORT:-3000}:3000'
      - '${METRICS_BIND_HOST:-127.0.0.1}:${METRICS_API_HOST_PORT:-9464}:9464'
    volumes:
      - user_files:/app/var/storage
      - ./infra/certs:/app/certs:ro
    depends_on: *runtime-deps
    healthcheck: *health
    # DB drain budget controls exit; this ceiling must not kill a 60-minute drain early.
    stop_grace_period: 3630s
    mem_limit: ${API_MEMORY_LIMIT:-512m}
    cpus: ${API_CPU_LIMIT:-1.0}

  admin:
    <<: *backend
    command: ['node', '--enable-source-maps', 'dist/entrypoints/admin.js']
    environment:
      <<: [*app-env, *processing-nodes-env]
      SERVICE_ROLE: admin
      HOST: 0.0.0.0
      PORT: '3000'
      HTTP_TRUST_PROXY_HOPS: ${ADMIN_TRUST_PROXY_HOPS:-0}
      HEALTHCHECK_URL: http://127.0.0.1:3000/health/ready
      DATABASE_URL: ${DATABASE_ADMIN_URL:-${DATABASE_URL:?Set runtime database URL}}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX_ADMIN:-5}
      ADMIN_PUBLIC_BASE_URL: ${ADMIN_PUBLIC_BASE_URL:-http://localhost:3001}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Generate an independent admin secret}
      PROCESSING_NODE_TOKEN_DOCUMENT: ${PROCESSING_NODE_TOKEN_DOCUMENT:-}
      PROCESSING_NODE_TOKEN_AUDIO: ${PROCESSING_NODE_TOKEN_AUDIO:-}
    ports:
      - '${ADMIN_BIND_HOST:-127.0.0.1}:${ADMIN_HOST_PORT:-3001}:3000'
      - '${METRICS_BIND_HOST:-127.0.0.1}:${METRICS_ADMIN_HOST_PORT:-9465}:9464'
    volumes:
      - ./infra/certs:/app/certs:ro
    depends_on: *runtime-deps
    healthcheck: *health
    # DB drain budget controls exit; this ceiling must not kill a 60-minute drain early.
    stop_grace_period: 3630s
    mem_limit: ${ADMIN_MEMORY_LIMIT:-512m}
    cpus: ${ADMIN_CPU_LIMIT:-1.0}

  worker:
    <<: *backend
    command: ['node', '--enable-source-maps', 'dist/entrypoints/worker.js']
    environment:
      <<: [*app-env, *processing-nodes-env]
      WORKER_QUEUES: ${WORKER_QUEUES:-content,ai,commercial,maintenance}
      SERVICE_ROLE: worker
      HOST: 127.0.0.1
      PORT: '3100'
      HEALTHCHECK_URL: http://127.0.0.1:3100/health/ready
      DATABASE_URL: ${DATABASE_WORKER_URL:-${DATABASE_URL:?Set runtime database URL}}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX_WORKER:-10}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_ROOT: /app/var/storage
      STORAGE_ALIYUN_OSS_REGION: ${STORAGE_ALIYUN_OSS_REGION:-cn-beijing}
      STORAGE_ALIYUN_OSS_ENDPOINT: ${STORAGE_ALIYUN_OSS_ENDPOINT:-https://oss-cn-beijing.aliyuncs.com}
      STORAGE_ALIYUN_OSS_PUBLIC_ENDPOINT: ${STORAGE_ALIYUN_OSS_PUBLIC_ENDPOINT:-}
      STORAGE_ALIYUN_OSS_BUCKET: ${STORAGE_ALIYUN_OSS_BUCKET:-}
      ALIYUN_RAM_ACCESS_KEY_ID: ${ALIYUN_RAM_ACCESS_KEY_ID:-}
      ALIYUN_RAM_ACCESS_KEY_SECRET: ${ALIYUN_RAM_ACCESS_KEY_SECRET:-}
      STORAGE_ALIYUN_OSS_SECURE: ${STORAGE_ALIYUN_OSS_SECURE:-true}
      STORAGE_ALIYUN_OSS_TIMEOUT_MS: ${STORAGE_ALIYUN_OSS_TIMEOUT_MS:-120000}
      STORAGE_ALIYUN_OSS_KEY_PREFIX: ${STORAGE_ALIYUN_OSS_KEY_PREFIX:-huahuo}
      RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-}
      grpc_proxy: ${grpc_proxy:-}
      MILVUS_ADDRESS: ${MILVUS_ADDRESS:-}
      MILVUS_USERNAME: ${MILVUS_USERNAME:-}
      MILVUS_PASSWORD: ${MILVUS_PASSWORD:-}
    ports:
      - '${METRICS_BIND_HOST:-127.0.0.1}:${METRICS_WORKER_HOST_PORT:-9466}:9464'
    volumes:
      - user_files:/app/var/storage
      - ./infra/certs:/app/certs:ro
    depends_on: *runtime-deps
    healthcheck:
      <<: *health
      # Probe promptly at startup; avoid spawning Node every 5s while idle.
      interval: 30s
      start_interval: 5s
    # DB drain budget controls exit; this ceiling must not kill a 60-minute drain early.
    stop_grace_period: 3630s
    mem_limit: ${WORKER_MEMORY_LIMIT:-1g}
    cpus: ${WORKER_CPU_LIMIT:-2.0}

  scheduler:
    <<: *backend
    command: ['node', '--enable-source-maps', 'dist/entrypoints/scheduler.js']
    environment:
      <<: [*app-env, *processing-nodes-env]
      SERVICE_ROLE: scheduler
      HOST: 127.0.0.1
      PORT: '3100'
      HEALTHCHECK_URL: http://127.0.0.1:3100/health/ready
      DATABASE_URL: ${DATABASE_SCHEDULER_URL:-${DATABASE_URL:?Set runtime database URL}}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX_SCHEDULER:-3}
    ports:
      - '${METRICS_BIND_HOST:-127.0.0.1}:${METRICS_SCHEDULER_HOST_PORT:-9467}:9464'
    volumes:
      - ./infra/certs:/app/certs:ro
    depends_on: *runtime-deps
    healthcheck:
      <<: *health
      interval: 30s
      start_interval: 5s
    # DB drain budget controls exit; this ceiling must not kill a 60-minute drain early.
    stop_grace_period: 3630s
    mem_limit: ${SCHEDULER_MEMORY_LIMIT:-256m}
    cpus: ${SCHEDULER_CPU_LIMIT:-0.5}

  migrate:
    <<: *backend
    restart: 'no'
    command: ['node', 'dist/entrypoints/migrate.js']
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-development}
      SERVICE_ROLE: migrate
      DATABASE_URL: ${DATABASE_MIGRATION_URL:-${DATABASE_URL:?Set runtime database URL}}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
      DATABASE_SSL_CA_FILE: ${DATABASE_SSL_CA_FILE:-}
      DATABASE_CONNECT_DEADLINE_MS: ${DATABASE_CONNECT_DEADLINE_MS:-120000}
      DATABASE_STATEMENT_TIMEOUT_MS: ${MIGRATION_STATEMENT_TIMEOUT_MS:-30000}
      MIGRATION_LOCK_TIMEOUT_MS: ${MIGRATION_LOCK_TIMEOUT_MS:-10000}
      DATABASE_POOL_MAX: '1'
    volumes:
      - ./infra/certs:/app/certs:ro
    stop_grace_period: 60s

  postgres:
    # Explicit local test profile only. Cloud runtime needs no local DB credentials.
    # PostgreSQL/init scripts reject missing passwords on a new local volume.
    profiles: [local-db]
    image: ${POSTGRES_IMAGE:-postgres:17.9-bookworm}
    environment:
      POSTGRES_USER: huahuo_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:-}
      POSTGRES_DB: huahuo
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-}
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD:-}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:-}
      POSTGRES_SCHEDULER_PASSWORD: ${POSTGRES_SCHEDULER_PASSWORD:-}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}

  redis:
    image: ${REDIS_IMAGE:?Pin supported stable Redis image}
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec', '--maxmemory-policy', 'noeviction', '--maxmemory', '${REDIS_MAXMEMORY:-256mb}']
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}

networks:
  backend:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  user_files:
