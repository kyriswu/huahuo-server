name: Server CI

# Required check: "Server CI". Keep this job name stable for main protection.
# This workflow uses only isolated local test resources, never production secrets.
on:
  pull_request:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-checks:
    name: Server code checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@10.15.1
          pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Review release plan against its deployed base revision
        # Compatibility controls deployment, not whether an incompatible change can be tested.
        run: pnpm release:review
      - name: Unit and contract tests
        run: pnpm test

  integration:
    name: PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@10.15.1
          pnpm install --frozen-lockfile
      - name: Prepare isolated integration images
        # integration.mjs deliberately uses --pull=never. These match its pins.
        run: |
          docker pull postgres:17.9-bookworm
          docker pull redis:7.4.8-bookworm
      - name: PostgreSQL and Redis integration tests
        # Each hosted job has its own VM; the runner also uses unique containers,
        # loopback ports, tmpfs and credentials, and cleans only resources it owns.
        # No --milvus or --milvus-cloud: remote providers stay disabled.
        run: pnpm test:integration

  server-ci:
    # Preserve the required check and require a pass from both isolated jobs.
    name: Server CI
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    needs: [code-checks, integration]
    if: ${{ always() }}
    steps:
      - name: Require both check suites to pass
        env:
          CODE_CHECKS_RESULT: ${{ needs.code-checks.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          if [[ "$CODE_CHECKS_RESULT" != success || "$INTEGRATION_RESULT" != success ]]; then
            printf '::error::Server code checks: %s. Integration: %s.\n' "$CODE_CHECKS_RESULT" "$INTEGRATION_RESULT"
            exit 1
          fi

  release-impact:
    name: Release impact report
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.0'
          package-manager-cache: false
      - name: Generate advisory impact report
        timeout-minutes: 3
        env:
          IMPACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          IMPACT_TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          npm install --global pnpm@10.15.1
          pnpm --dir .github/release-impact install --frozen-lockfile --ignore-scripts
          node .github/release-impact/report.mjs
      - name: Record unavailable report
        if: ${{ failure() }}
        run: |
          printf '%s\n\n%s\n' '## Server 变更影响报告' '本次分析未完成。请查看报告任务日志。' >> "$GITHUB_STEP_SUMMARY"
